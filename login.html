<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AL LIB - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a2e; background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #e0f2fe 100%); min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    /* Navbar */
    .navbar { background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #e5e7eb; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
    .nav-logo { display: flex; align-items: center; gap: 12px; }
    .nav-logo-icon { width: 40px; height: 40px; background: #22a352; color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
    .nav-logo-text { font-size: 20px; font-weight: 700; }
    .nav-back { font-size: 14px; font-weight: 500; color: #6b7280; transition: color 0.2s; }
    .nav-back:hover { color: #22a352; }

    /* Login Container */
    .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .login-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 420px; }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header .icon-circle { width: 56px; height: 56px; background: #ecfdf5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .login-header .icon-circle svg { width: 28px; height: 28px; stroke: #22a352; fill: none; }
    .login-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .login-header p { font-size: 14px; color: #6b7280; }

    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #374151; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .form-group input:focus { border-color: #22a352; box-shadow: 0 0 0 3px rgba(34,163,82,0.15); }
    .form-group input::placeholder { color: #9ca3af; }
    .form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #374151; cursor: pointer; }
    .checkbox-label input[type="checkbox"] { width: 16px; height: 16px; accent-color: #22a352; cursor: pointer; }
    .forgot-link { font-size: 13px; color: #22a352; font-weight: 500; }
    .forgot-link:hover { text-decoration: underline; }

    .btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #22a352; color: #fff; }
    .btn-primary:hover { background: #1b8a44; }

    .signup-text { text-align: center; margin-top: 20px; font-size: 14px; color: #6b7280; }
    .signup-text a { color: #22a352; font-weight: 600; }
    .signup-text a:hover { text-decoration: underline; }

    /* Alert */
    .alert { display: none; padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .alert.show { display: block; }

    /* Password toggle */
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 42px; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #9ca3af; padding: 0; }
    .password-toggle:hover { color: #6b7280; }
    .password-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }

    /* Footer */
    .footer { text-align: center; padding: 20px 24px; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">+</div>
        <span class="nav-logo-text">AL LIB</span>
      </a>
      <a href="index.html" class="nav-back">← Back to Home</a>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to your AL LIB account</p>
      </div>

      <div class="alert alert-error" id="alertError">Invalid email or password. Please try again.</div>
      <div class="alert alert-success" id="alertSuccess">Login successful! Redirecting...</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required minlength="6" />
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
<a href="home.html">
        <button type="button" class="btn btn-primary">Sign In</button>
      </a>
      </form>

      <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <div class="footer">© 2026 AL LIB. All rights reserved.</div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      document.getElementById('alertError').classList.remove('show');
      document.getElementById('alertSuccess').classList.remove('show');

      // Demo validation
      if (email && password.length >= 6) {
        document.getElementById('alertSuccess').classList.add('show');
        setTimeout(() => { alert('Login successful! (Demo)'); }, 1000);
      } else {
        document.getElementById('alertError').classList.add('show');
      }
    }
  </script>

</body>
</html>
