<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AL LIB - Sign Up</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a2e; background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #e0f2fe 100%); min-height: 100vh; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }
    .navbar { background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #e5e7eb; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; }
    .nav-logo { display: flex; align-items: center; gap: 12px; }
    .nav-logo-icon { width: 40px; height: 40px; background: #22a352; color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
    .nav-logo-text { font-size: 20px; font-weight: 700; }
    .nav-back { font-size: 14px; font-weight: 500; color: #6b7280; transition: color 0.2s; }
    .nav-back:hover { color: #22a352; }

    .signup-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .signup-card { background: #fff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 420px; }
    .signup-header { text-align: center; margin-bottom: 32px; }
    .signup-header .icon-circle { width: 56px; height: 56px; background: #ecfdf5; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .signup-header .icon-circle svg { width: 28px; height: 28px; stroke: #22a352; fill: none; }
    .signup-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .signup-header p { font-size: 14px; color: #6b7280; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #374151; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .form-group input:focus { border-color: #22a352; box-shadow: 0 0 0 3px rgba(34,163,82,0.15); }
    .form-group input::placeholder { color: #9ca3af; }

    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 42px; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #9ca3af; padding: 0; }
    .password-toggle:hover { color: #6b7280; }
    .password-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; }

    .password-strength { height: 4px; border-radius: 2px; background: #e5e7eb; margin-top: 8px; overflow: hidden; }
    .password-strength-bar { height: 100%; border-radius: 2px; width: 0; transition: width 0.3s, background 0.3s; }
    .password-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    .checkbox-label { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #374151; cursor: pointer; margin-bottom: 20px; line-height: 1.4; }
    .checkbox-label input[type="checkbox"] { width: 16px; height: 16px; accent-color: #22a352; cursor: pointer; margin-top: 2px; flex-shrink: 0; }
    .checkbox-label a { color: #22a352; font-weight: 500; }
    .checkbox-label a:hover { text-decoration: underline; }

    .btn { width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #22a352; color: #fff; }
    .btn-primary:hover { background: #1b8a44; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

    .login-text { text-align: center; margin-top: 24px; font-size: 14px; color: #6b7280; }
    .login-text a { color: #22a352; font-weight: 600; }
    .login-text a:hover { text-decoration: underline; }

    .alert { display: none; padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .alert.show { display: block; }

    .footer { text-align: center; padding: 20px 24px; font-size: 13px; color: #9ca3af; }

    @media (max-width: 420px) {
      .signup-card { padding: 28px; }
      .form-row-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">+</div>
        <span class="nav-logo-text">AL LIB</span>
      </a>
      <a href="index.html" class="nav-back">← Back to Home</a>
    </div>
  </nav>

  <div class="signup-wrapper">
    <div class="signup-card">
      <div class="signup-header">
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        </div>
        <h1>Create Account</h1>
        <p>Join AL LIB and start managing your appointments</p>
      </div>

      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess">Account created successfully! Redirecting...</div>

      <form id="signupForm" onsubmit="handleSignup(event)">
        <div class="form-row-2">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Mohammed" required />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Al-Rashid" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+966 5X XXX XXXX" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required minlength="6" oninput="checkStrength(this.value)" />
            <button type="button" class="password-toggle" onclick="togglePassword('password','eyeIcon1')">
              <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="password-strength"><div class="password-strength-bar" id="strengthBar"></div></div>
          <div class="password-hint" id="strengthText">At least 6 characters</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" />
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword','eyeIcon2')">
              <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="terms" required />
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p class="login-text">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <div class="footer">© 2026 AL LIB. All rights reserved.</div>

  <script>
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function checkStrength(val) {
      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { w: '0%', c: '#e5e7eb', t: 'At least 6 characters' },
        { w: '20%', c: '#ef4444', t: 'Weak' },
        { w: '40%', c: '#f97316', t: 'Fair' },
        { w: '60%', c: '#eab308', t: 'Good' },
        { w: '80%', c: '#22c55e', t: 'Strong' },
        { w: '100%', c: '#16a34a', t: 'Very Strong' }
      ];

      const l = levels[score];
      bar.style.width = l.w;
      bar.style.background = l.c;
      text.textContent = l.t;
    }

    function handleSignup(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('alertError');
      const sucEl = document.getElementById('alertSuccess');

      errEl.classList.remove('show');
      sucEl.classList.remove('show');

      if (pw !== cpw) {
        errEl.textContent = 'Passwords do not match.';
        errEl.classList.add('show');
        return;
      }
      if (pw.length < 6) {
        errEl.textContent = 'Password must be at least 6 characters.';
        errEl.classList.add('show');
        return;
      }

      sucEl.classList.add('show');
      setTimeout(() => { alert('Account created! (Demo)'); }, 1000);
    }
  </script>
</body>
</html>
